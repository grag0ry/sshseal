[package]
name = "sshseal"
version = "0.1.1"
edition = "2021"
license = "BSD-2-Clause"

[dependencies]
sha2 = "0.10"
base64 = "0.22"
hkdf = "0.12"
aes-gcm = { version = "0.10", features = ["zeroize"] }
aes = { version = "0.8", features = ["zeroize"] }
getrandom = "0.2"
zeroize = "1"

[dev-dependencies]
ed25519-dalek = "2"
